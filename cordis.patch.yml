# dsh-abap-editor bundle patch: inserts this plugin's row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile desktop add link:<本仓库路径>`.
#
# The row is a bare plugin by package name: the node half (exports ".") is an
# empty `apply` — the ABAP document renderer is browser-only — and the
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client") load in the web GUI, where it registers with the official
# sidebar document-preview registry.
- insert:
    - id: dsh-abap-editor
      name: 'dsh-abap-editor'
